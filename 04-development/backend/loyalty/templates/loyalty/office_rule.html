{% extends "loyalty/base.html" %}
{% block title %}Правило{% endblock %}
{% block content %}
<h1>Процент начисления</h1>
<p class="hint">Списание всегда 1 бонус = 1 ₽. Здесь — какая доля чека капает на счёт. Сейчас 10% по решению собственника. Старые операции не пересчитываются.</p>
<form method="post" class="ticket" style="max-width:28rem">
  {% csrf_token %}
  <label>Процент</label>
  <input class="xl" name="percent" type="number" step="0.01" min="0" max="100" value="{{ rule.percent }}" required>
  <button class="btn" type="submit">Сохранить</button>
</form>
{% endblock %}
