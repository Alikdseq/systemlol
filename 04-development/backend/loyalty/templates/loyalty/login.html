{% extends "loyalty/base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="ticket">
    <p class="tag">Касса лояльности</p>
    <h1>Вход</h1>
    <p class="hint">Кассир — смена у 1С. Админ — журнал по сети.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Войти</button>
    </form>
  </div>
</div>
{% endblock %}
